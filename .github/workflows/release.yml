name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests and dependency audit
        run: |
          npm test
          npm audit

      - name: Build Windows installer
        run: npm run make

      - name: Create release and upload installer assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $tag = [string]$env:GITHUB_REF_NAME
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match package version $version."
          }

          $repository = [string]$env:GITHUB_REPOSITORY
          $api = "https://api.github.com/repos/$repository"
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'BharatCyberBrowserRelease'
          }

          $release = $null
          try {
            $release = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/$tag" -Headers $headers
          } catch {
            $statusCode = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            if ($statusCode -ne 404) { throw }
          }

          if (-not $release) {
            $releaseBody = @{
              tag_name = $tag
              name = "Bharat Cyber Browser $tag"
              body = "Windows x64 installer. This build is unsigned; review the README security notes before installing."
              draft = $true
              prerelease = $false
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers `
              -ContentType 'application/vnd.github+json' -Body $releaseBody
          }

          $assetDirectory = Join-Path $env:GITHUB_WORKSPACE 'out/make/squirrel.windows/x64'
          $assetNames = @(
            "Bharat Cyber Browser-$version Setup.exe",
            "BharatCyberBrowser-$version-full.nupkg",
            'RELEASES'
          )
          $assets = foreach ($name in $assetNames) {
            $file = Join-Path $assetDirectory $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release asset: $name" }
            Get-Item -LiteralPath $file
          }

          $remoteAssets = @(Invoke-RestMethod -Method Get -Uri "$api/releases/$($release.id)/assets?per_page=100" -Headers $headers)
          foreach ($asset in $assets) {
            $existing = $remoteAssets | Where-Object { $_.name -eq $asset.Name } | Select-Object -First 1
            $localHash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($existing) {
              if ($existing.digest -ne "sha256:$localHash") {
                throw "Release asset $($asset.Name) already exists with different content; refusing to replace it."
              }
              Write-Host "Verified existing asset $($asset.Name)"
              continue
            }

            $uploadUri = "https://uploads.github.com/repos/$repository/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($asset.Name))"
            Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers `
              -ContentType 'application/octet-stream' -InFile $asset.FullName | Out-Null
            Write-Host "Uploaded $($asset.Name)"
          }

          $publishBody = @{ draft = $false; prerelease = $false; make_latest = 'true' } | ConvertTo-Json
          Invoke-RestMethod -Method Patch -Uri "$api/releases/$($release.id)" -Headers $headers `
            -ContentType 'application/vnd.github+json' -Body $publishBody | Out-Null
          Write-Host "Published $tag with all three verified assets."
